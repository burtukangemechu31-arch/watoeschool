<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gate ID - {{ student.student_id }}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .id-card { width: 350px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; border: 2px solid #1e293b; }
        .header { background: #1e293b; color: white; padding: 15px; text-align: center; }
        .header h2 { margin: 0; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        .header p { margin: 5px 0 0; font-size: 12px; color: #94a3b8; }
        .body { padding: 20px; text-align: center; }
        .photo-placeholder { width: 100px; height: 100px; background: #e2e8f0; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #64748b; font-weight: bold; border: 3px solid #059669; }
        .name { font-size: 20px; font-weight: bold; color: #0f172a; margin-bottom: 5px; }
        .details { font-size: 14px; color: #475569; margin-bottom: 15px; }
        .barcode-box { background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px dashed #cbd5e1; font-family: monospace; font-size: 16px; letter-spacing: 3px; font-weight: bold; color: #1e293b; }
        @media print { body { background: none; } .id-card { box-shadow: none; } }
    </style>
</head>
<body>
    <div class="id-card">
        <div class="header">
            <h2>Wato Secondary School</h2>
            <p>Official Student Gate Identification</p>
        </div>
        <div class="body">
            <div class="photo-placeholder">
                {{ student.user.first_name|slice:":1" }}{{ student.user.last_name|slice:":1" }}
            </div>
            <div class="name">{{ student.user.get_full_name }}</div>
            <div class="details">
                ID: <strong>{{ student.student_id }}</strong><br>
                Grade & Section: <strong>{{ student.section }}</strong>
            </div>
            <div class="barcode-box">
                ||| | |||| || | |||||
                <br><span style="font-size: 11px; letter-spacing: normal;">{{ student.student_id }}</span>
            </div>
        </div>
    </div>
</body>
</html>
