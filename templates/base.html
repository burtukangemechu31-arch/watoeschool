<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wato Secondary School IMS{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            600: '#059669', // Wato Forest Green Accent
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">
    <!-- Top Navbar -->
    <header class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-emerald-900 text-white shadow-lg border-b border-emerald-700">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <a href="/" class="text-xl font-black tracking-tight flex items-center gap-2 hover:text-emerald-200 transition">
                <span>🛡️ Wato IMS</span>
            </a>
            <nav>
                <ul class="flex flex-wrap items-center gap-1 sm:gap-2 text-xs sm:text-sm font-medium">
                    <li><a href="/" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700/60 transition">Dashboard</a></li>
                    <li><a href="/admin/academics/studentprofile/" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700/60 transition">Academics</a></li>
                    <li><a href="/admin/attendance/dailyattendance/" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700/60 transition">Attendance</a></li>
                    <li><a href="/admin/exams/exam/" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700/60 transition">Exams</a></li>
                    <li><a href="/admin/library/book/" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700/60 transition">Library</a></li>
                    <li><a href="/admin/attendance/gatelog/" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700/60 transition">Guard Exits</a></li>
                    <li><a href="/admin/inventory/schoolasset/" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700/60 transition">Inventory</a></li>
                    <li>
                        <a href="/admin/" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-lg shadow-sm transition ml-2">
                            Admin Portal
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
        Wato Secondary School Information Management System &bull; Powered by Django & Wato Forest Green Theme
    </footer>
</body>
</html>
